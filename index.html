<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IRON MAN SUIT-UP</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600&display=swap');

  :root {
    --gold: #c8901a;
    --red: #8b0000;
    --arc: #00d4ff;
    --arc-glow: rgba(0, 212, 255, 0.6);
    --dark: #050a0f;
    --panel: rgba(0, 20, 40, 0.85);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--dark);
    font-family: 'Orbitron', monospace;
    color: var(--arc);
    overflow: hidden;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  /* Animated grid background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      linear-gradient(rgba(0,212,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,212,255,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    animation: gridPulse 4s ease-in-out infinite;
    pointer-events: none;
  }

  @keyframes gridPulse {
    0%, 100% { opacity: 0.5; }
    50% { opacity: 1; }
  }

  .header {
    text-align: center;
    margin-bottom: 20px;
    position: relative;
    z-index: 10;
  }

  .header h1 {
    font-size: clamp(20px, 4vw, 36px);
    font-weight: 900;
    letter-spacing: 0.3em;
    color: var(--gold);
    text-shadow: 0 0 30px rgba(200,144,26,0.8), 0 0 60px rgba(200,144,26,0.4);
    animation: titlePulse 2s ease-in-out infinite;
  }

  @keyframes titlePulse {
    0%, 100% { text-shadow: 0 0 30px rgba(200,144,26,0.8); }
    50% { text-shadow: 0 0 50px rgba(200,144,26,1), 0 0 80px rgba(200,144,26,0.6); }
  }

  .header p {
    font-family: 'Rajdhani', sans-serif;
    font-size: 13px;
    letter-spacing: 0.2em;
    color: rgba(0,212,255,0.6);
    margin-top: 6px;
  }

  .main-container {
    display: flex;
    gap: 20px;
    align-items: flex-start;
    position: relative;
    z-index: 10;
  }

  /* Upload Panel */
  .upload-panel {
    width: 220px;
    background: var(--panel);
    border: 1px solid rgba(0,212,255,0.2);
    border-radius: 4px;
    padding: 16px;
    box-shadow: 0 0 20px rgba(0,212,255,0.1), inset 0 0 20px rgba(0,0,0,0.5);
  }

  .panel-title {
    font-size: 10px;
    letter-spacing: 0.3em;
    color: var(--arc);
    margin-bottom: 12px;
    padding-bottom: 8px;
    border-bottom: 1px solid rgba(0,212,255,0.2);
  }

  .upload-zone {
    border: 2px dashed rgba(0,212,255,0.3);
    border-radius: 4px;
    padding: 20px 10px;
    text-align: center;
    cursor: pointer;
    transition: all 0.3s;
    background: rgba(0,212,255,0.03);
    position: relative;
    overflow: hidden;
  }

  .upload-zone:hover {
    border-color: var(--arc);
    background: rgba(0,212,255,0.08);
    box-shadow: 0 0 20px rgba(0,212,255,0.2);
  }

  .upload-zone.drag-over {
    border-color: var(--gold);
    background: rgba(200,144,26,0.1);
  }

  .upload-icon {
    font-size: 32px;
    margin-bottom: 8px;
    display: block;
  }

  .upload-zone p {
    font-family: 'Rajdhani', sans-serif;
    font-size: 12px;
    color: rgba(0,212,255,0.6);
    line-height: 1.4;
  }

  #fileInput { display: none; }

  .preview-img {
    width: 100%;
    border-radius: 3px;
    margin-top: 12px;
    border: 1px solid rgba(0,212,255,0.3);
    display: none;
    box-shadow: 0 0 15px rgba(0,212,255,0.2);
  }

  .btn-transform {
    width: 100%;
    margin-top: 14px;
    padding: 12px;
    background: linear-gradient(135deg, var(--red), #c0392b);
    border: 1px solid rgba(200,144,26,0.5);
    color: var(--gold);
    font-family: 'Orbitron', monospace;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.2em;
    cursor: pointer;
    border-radius: 3px;
    transition: all 0.3s;
    display: none;
    position: relative;
    overflow: hidden;
    text-transform: uppercase;
  }

  .btn-transform::before {
    content: '';
    position: absolute;
    top: -50%; left: -50%;
    width: 200%; height: 200%;
    background: linear-gradient(45deg, transparent, rgba(255,255,255,0.1), transparent);
    transform: rotate(45deg);
    transition: all 0.5s;
    opacity: 0;
  }

  .btn-transform:hover::before { opacity: 1; left: 100%; }
  .btn-transform:hover {
    box-shadow: 0 0 25px rgba(200,144,26,0.6);
    transform: translateY(-1px);
  }

  .btn-transform:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    transform: none;
  }

  /* Status */
  .status-log {
    margin-top: 14px;
    font-family: 'Rajdhani', sans-serif;
    font-size: 11px;
    color: rgba(0,212,255,0.7);
    line-height: 1.8;
    min-height: 60px;
  }

  .status-line { display: flex; align-items: center; gap: 6px; }
  .status-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--arc);
    box-shadow: 0 0 6px var(--arc);
    animation: blink 1s infinite;
    flex-shrink: 0;
  }
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.2; } }

  /* Canvas area */
  .canvas-container {
    position: relative;
    width: 400px;
    height: 500px;
  }

  #mainCanvas {
    border: 1px solid rgba(0,212,255,0.2);
    border-radius: 4px;
    background: #020810;
    box-shadow: 0 0 40px rgba(0,212,255,0.15), inset 0 0 60px rgba(0,0,0,0.8);
    display: block;
  }

  /* Corner decorations */
  .corner {
    position: absolute;
    width: 20px; height: 20px;
    border-color: var(--gold);
    border-style: solid;
    opacity: 0.7;
  }
  .corner-tl { top: -1px; left: -1px; border-width: 2px 0 0 2px; }
  .corner-tr { top: -1px; right: -1px; border-width: 2px 2px 0 0; }
  .corner-bl { bottom: -1px; left: -1px; border-width: 0 0 2px 2px; }
  .corner-br { bottom: -1px; right: -1px; border-width: 0 2px 2px 0; }

  /* HUD overlay on canvas */
  .hud-overlay {
    position: absolute;
    top: 10px; left: 10px; right: 10px;
    display: flex;
    justify-content: space-between;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.3s;
  }

  .hud-overlay.visible { opacity: 1; }

  .hud-text {
    font-size: 9px;
    letter-spacing: 0.15em;
    color: rgba(0,212,255,0.7);
    font-family: 'Rajdhani', sans-serif;
  }

  /* Progress bar */
  .progress-container {
    margin-top: 10px;
    height: 3px;
    background: rgba(0,212,255,0.1);
    border-radius: 2px;
    overflow: hidden;
    display: none;
  }

  .progress-bar {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--arc), var(--gold));
    box-shadow: 0 0 10px var(--arc);
    transition: width 0.1s linear;
    border-radius: 2px;
  }

  /* Download btn */
  .btn-download {
    width: 100%;
    margin-top: 10px;
    padding: 10px;
    background: transparent;
    border: 1px solid rgba(0,212,255,0.4);
    color: var(--arc);
    font-family: 'Orbitron', monospace;
    font-size: 10px;
    letter-spacing: 0.2em;
    cursor: pointer;
    border-radius: 3px;
    transition: all 0.3s;
    display: none;
  }

  .btn-download:hover {
    background: rgba(0,212,255,0.1);
    box-shadow: 0 0 15px rgba(0,212,255,0.3);
  }

  /* Scanline effect */
  @keyframes scanline {
    0% { transform: translateY(-100%); }
    100% { transform: translateY(100vh); }
  }

  .scanline {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, rgba(0,212,255,0.15), transparent);
    animation: scanline 6s linear infinite;
    pointer-events: none;
    z-index: 1;
  }
</style>
</head>
<body>

<div class="scanline"></div>

<div class="header">
  <h1>⚙ IRON MAN SUIT-UP</h1>
  <p>STARK INDUSTRIES · MARK L TRANSFORMATION SYSTEM</p>
</div>

<div class="main-container">
  <div class="upload-panel">
    <div class="panel-title">▸ TARGET UPLOAD</div>

    <div class="upload-zone" id="uploadZone">
      <span class="upload-icon">👤</span>
      <p>DROP PHOTO HERE<br>or click to select</p>
    </div>
    <input type="file" id="fileInput" accept="image/*">

    <img id="previewImg" class="preview-img" alt="Preview">

    <button class="btn-transform" id="btnTransform">
      ⚡ INITIATE SUIT-UP
    </button>

    <div class="progress-container" id="progressContainer">
      <div class="progress-bar" id="progressBar"></div>
    </div>

    <div class="status-log" id="statusLog">
      <div class="status-line">
        <div class="status-dot"></div>
        <span>JARVIS ONLINE · AWAITING TARGET</span>
      </div>
    </div>

    <button class="btn-download" id="btnDownload">⬇ SAVE VIDEO</button>
  </div>

  <div class="canvas-container">
    <div class="corner corner-tl"></div>
    <div class="corner corner-tr"></div>
    <div class="corner corner-bl"></div>
    <div class="corner corner-br"></div>
    <canvas id="mainCanvas" width="400" height="500"></canvas>
    <div class="hud-overlay" id="hudOverlay">
      <span class="hud-text" id="hudLeft">MARK L</span>
      <span class="hud-text" id="hudRight">STARK TECH</span>
    </div>
  </div>
</div>

<script>
const canvas = document.getElementById('mainCanvas');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

let userPhoto = null;
let animFrame = null;
let recordedChunks = [];
let mediaRecorder = null;
let isRecording = false;
let animProgress = 0;

// ── Upload handling ─────────────────────────────────────────
const uploadZone = document.getElementById('uploadZone');
const fileInput = document.getElementById('fileInput');
const previewImg = document.getElementById('previewImg');
const btnTransform = document.getElementById('btnTransform');
const statusLog = document.getElementById('statusLog');
const progressContainer = document.getElementById('progressContainer');
const progressBar = document.getElementById('progressBar');
const hudOverlay = document.getElementById('hudOverlay');
const btnDownload = document.getElementById('btnDownload');

uploadZone.addEventListener('click', () => fileInput.click());
uploadZone.addEventListener('dragover', e => { e.preventDefault(); uploadZone.classList.add('drag-over'); });
uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('drag-over'));
uploadZone.addEventListener('drop', e => {
  e.preventDefault();
  uploadZone.classList.remove('drag-over');
  const file = e.dataTransfer.files[0];
  if (file && file.type.startsWith('image/')) loadImage(file);
});

fileInput.addEventListener('change', e => {
  if (e.target.files[0]) loadImage(e.target.files[0]);
});

function loadImage(file) {
  const reader = new FileReader();
  reader.onload = ev => {
    const img = new Image();
    img.onload = () => {
      userPhoto = img;
      previewImg.src = ev.target.result;
      previewImg.style.display = 'block';
      btnTransform.style.display = 'block';
      setStatus('TARGET ACQUIRED · PHOTO LOADED');
      drawIdleState();
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

function setStatus(msg) {
  statusLog.innerHTML = `
    <div class="status-line">
      <div class="status-dot"></div>
      <span>${msg}</span>
    </div>`;
}

function drawIdleState() {
  ctx.clearRect(0, 0, W, H);
  drawBackground(0);
  if (userPhoto) drawPhoto(1.0, 0, 0);
  // Draw HUD frame
  drawHUDFrame(0.3);
}

// ── Main Transform ───────────────────────────────────────────
btnTransform.addEventListener('click', startTransformation);

function startTransformation() {
  if (!userPhoto) return;
  btnTransform.disabled = true;
  btnDownload.style.display = 'none';
  recordedChunks = [];
  progressContainer.style.display = 'block';
  hudOverlay.classList.add('visible');

  // Setup MediaRecorder
  const stream = canvas.captureStream(30);
  mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp9' });
  mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data); };
  mediaRecorder.onstop = onRecordingDone;
  mediaRecorder.start();
  isRecording = true;

  const DURATION = 9000; // 9 seconds
  const startTime = performance.now();

  function animate(now) {
    const elapsed = now - startTime;
    animProgress = Math.min(elapsed / DURATION, 1);
    progressBar.style.width = (animProgress * 100) + '%';

    ctx.clearRect(0, 0, W, H);
    renderFrame(animProgress, elapsed);
    updateStatusFromProgress(animProgress);

    if (animProgress < 1) {
      animFrame = requestAnimationFrame(animate);
    } else {
      // Final frame hold
      setTimeout(() => {
        if (mediaRecorder && isRecording) {
          mediaRecorder.stop();
          isRecording = false;
        }
        btnTransform.disabled = false;
        hudOverlay.classList.remove('visible');
        setStatus('SUIT-UP COMPLETE · READY FOR DEPLOYMENT');
      }, 500);
    }
  }

  animFrame = requestAnimationFrame(animate);
}

function updateStatusFromProgress(p) {
  if (p < 0.12) setStatus('SCANNING TARGET BIOMETRICS...');
  else if (p < 0.25) setStatus('DEPLOYING NANO BOOTS...');
  else if (p < 0.40) setStatus('ASSEMBLING LEG PLATING...');
  else if (p < 0.55) setStatus('TORSO ARMOR DEPLOYING...');
  else if (p < 0.68) setStatus('ARM REPULSORS ATTACHING...');
  else if (p < 0.80) setStatus('SHOULDER PAULDRONS LOCKING...');
  else if (p < 0.92) setStatus('HELMET DEPLOYMENT SEQUENCE...');
  else setStatus('⚡ MARK L FULLY OPERATIONAL');
}

// ── Render Engine ────────────────────────────────────────────
function renderFrame(p, elapsed) {
  drawBackground(p);

  // Phases:
  // 0.00–0.10  intro scan
  // 0.10–0.30  boots + lower legs
  // 0.30–0.50  upper legs + waist
  // 0.50–0.65  torso + back
  // 0.65–0.78  arms
  // 0.78–0.90  shoulders + neck
  // 0.90–1.00  helmet + final glow

  const photoAlpha = p < 0.08 ? p / 0.08 : 1.0;
  drawPhoto(photoAlpha, p, elapsed);
  drawHUDFrame(Math.min(p * 3, 0.4));

  if (p > 0.08) drawScanEffect(p, elapsed);
  if (p > 0.10) drawBoots(easeIn(remap(p, 0.10, 0.28, 0, 1)), elapsed);
  if (p > 0.22) drawShinGuards(easeIn(remap(p, 0.22, 0.38, 0, 1)), elapsed);
  if (p > 0.35) drawThighPlates(easeIn(remap(p, 0.35, 0.50, 0, 1)), elapsed);
  if (p > 0.46) drawWaistPelvis(easeIn(remap(p, 0.46, 0.58, 0, 1)), elapsed);
  if (p > 0.54) drawChestBack(easeIn(remap(p, 0.54, 0.68, 0, 1)), elapsed);
  if (p > 0.60) drawArcReactor(easeIn(remap(p, 0.60, 0.72, 0, 1)), elapsed);
  if (p > 0.65) drawArms(easeIn(remap(p, 0.65, 0.80, 0, 1)), elapsed);
  if (p > 0.75) drawShoulders(easeIn(remap(p, 0.75, 0.87, 0, 1)), elapsed);
  if (p > 0.85) drawHelmet(easeIn(remap(p, 0.85, 0.98, 0, 1)), elapsed);
  if (p > 0.95) drawFinalGlow(remap(p, 0.95, 1, 0, 1), elapsed);

  // Particle sparks during assembly
  if (p > 0.10 && p < 0.97) drawAssemblySparks(p, elapsed);
}

// ── Drawing Helpers ──────────────────────────────────────────
function remap(v, lo, hi, a, b) { return Math.max(0, Math.min(1, (v - lo) / (hi - lo))) * (b - a) + a; }
function easeIn(t) { return t * t * (3 - 2 * t); }
function easeOut(t) { return 1 - Math.pow(1 - t, 3); }

function drawBackground(p) {
  const grad = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, Math.max(W,H)*0.8);
  grad.addColorStop(0, `rgba(8,2,2,1)`);
  grad.addColorStop(0.5, `rgba(2,8,18,1)`);
  grad.addColorStop(1, `rgba(0,2,5,1)`);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // Ambient glow based on progress
  if (p > 0.5) {
    const glowStr = (p - 0.5) * 2;
    const glowGrad = ctx.createRadialGradient(W/2, H*0.45, 0, W/2, H*0.45, 180);
    glowGrad.addColorStop(0, `rgba(139,0,0,${glowStr * 0.15})`);
    glowGrad.addColorStop(1, 'transparent');
    ctx.fillStyle = glowGrad;
    ctx.fillRect(0, 0, W, H);
  }
}

function drawPhoto(alpha, p, elapsed) {
  if (!userPhoto) return;
  ctx.save();
  ctx.globalAlpha = alpha;

  // Fit photo centered
  const scale = Math.min(W / userPhoto.width, H / userPhoto.height) * 0.9;
  const sw = userPhoto.width * scale;
  const sh = userPhoto.height * scale;
  const sx = (W - sw) / 2;
  const sy = (H - sh) / 2;

  // Slight desaturate as suit assembles
  if (p > 0.3) {
    ctx.filter = `saturate(${Math.max(0.2, 1 - (p - 0.3) * 1.2)}) brightness(${0.7 + (1-p)*0.3})`;
  }

  ctx.drawImage(userPhoto, sx, sy, sw, sh);
  ctx.filter = 'none';
  ctx.restore();
}

function drawScanEffect(p, elapsed) {
  // Blue scan line sweeping down
  const scanPhase = remap(p, 0.08, 0.20, 0, 1);
  const scanY = scanPhase * H;
  const grad = ctx.createLinearGradient(0, scanY - 30, 0, scanY + 30);
  grad.addColorStop(0, 'transparent');
  grad.addColorStop(0.5, 'rgba(0,212,255,0.35)');
  grad.addColorStop(1, 'transparent');
  ctx.fillStyle = grad;
  ctx.fillRect(0, scanY - 30, W, 60);

  // Scan line glow
  ctx.strokeStyle = 'rgba(0,212,255,0.8)';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(0, scanY);
  ctx.lineTo(W, scanY);
  ctx.stroke();
}

function getBodyBounds() {
  if (!userPhoto) return { cx: W/2, cy: H/2, photoH: H*0.9, photoW: W*0.7 };
  const scale = Math.min(W / userPhoto.width, H / userPhoto.height) * 0.9;
  const sw = userPhoto.width * scale;
  const sh = userPhoto.height * scale;
  const sx = (W - sw) / 2;
  const sy = (H - sh) / 2;
  return { cx: W/2, cy: sy + sh/2, photoH: sh, photoW: sw, sx, sy, sw, sh };
}

// Armor color helpers
function armorRed(alpha=1) { return `rgba(160,20,20,${alpha})`; }
function armorGold(alpha=1) { return `rgba(200,144,26,${alpha})`; }
function armorDark(alpha=1) { return `rgba(60,10,10,${alpha})`; }
function arcBlue(alpha=1) { return `rgba(0,212,255,${alpha})`; }

function drawArmorPanel(x, y, w, h, t, opts={}) {
  const { color=armorRed(), stroke=armorGold(0.8), bevel=3, glow=null, scaleDir='down' } = opts;
  ctx.save();
  ctx.globalAlpha = Math.min(t, 1);
  // Scale in from direction
  const scale = easeOut(Math.min(t * 1.3, 1));
  const originY = scaleDir === 'down' ? y : y + h;
  ctx.translate(x + w/2, originY);
  ctx.scale(1, scale);
  ctx.translate(-(x + w/2), -originY);

  if (glow) {
    ctx.shadowColor = glow;
    ctx.shadowBlur = 15;
  }
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.roundRect(x, y, w, h, bevel);
  ctx.fill();
  ctx.strokeStyle = stroke;
  ctx.lineWidth = 1.2;
  ctx.stroke();
  ctx.shadowBlur = 0;
  ctx.restore();
}

function drawBoots(t, elapsed) {
  const b = getBodyBounds();
  const footY = b.sy + b.sh * 0.88;
  const footH = b.sh * 0.12;
  const cx = b.cx;
  const legSpread = b.photoW * 0.15;

  // Left boot
  drawArmorPanel(cx - legSpread - 22, footY, 44, footH, t, { color: armorRed(), scaleDir: 'up', glow: armorGold(0.3) });
  // Boot toe extra plate
  drawArmorPanel(cx - legSpread - 18, footY + footH*0.6, 36, footH*0.45, t * 0.9, { color: armorGold(0.9), scaleDir: 'up' });
  // Right boot
  drawArmorPanel(cx + legSpread - 22, footY, 44, footH, t, { color: armorRed(), scaleDir: 'up', glow: armorGold(0.3) });
  drawArmorPanel(cx + legSpread - 18, footY + footH*0.6, 36, footH*0.45, t * 0.9, { color: armorGold(0.9), scaleDir: 'up' });

  // Repulsor glow on boots
  if (t > 0.7) {
    const gl = remap(t, 0.7, 1, 0, 1);
    drawRepulsor(cx - legSpread, footY + footH + 4, gl * 8, elapsed);
    drawRepulsor(cx + legSpread, footY + footH + 4, gl * 8, elapsed);
  }
}

function drawShinGuards(t, elapsed) {
  const b = getBodyBounds();
  const shinY = b.sy + b.sh * 0.72;
  const shinH = b.sh * 0.16;
  const cx = b.cx;
  const legSpread = b.photoW * 0.15;

  drawArmorPanel(cx - legSpread - 19, shinY, 38, shinH, t, { color: armorRed(), glow: arcBlue(0.2) });
  // Shin detail line
  if (t > 0.5) {
    ctx.save(); ctx.globalAlpha = remap(t, 0.5, 1, 0, 0.6);
    ctx.strokeStyle = armorGold(0.7); ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(cx-legSpread, shinY+6); ctx.lineTo(cx-legSpread, shinY+shinH-6); ctx.stroke();
    ctx.restore();
  }

  drawArmorPanel(cx + legSpread - 19, shinY, 38, shinH, t, { color: armorRed(), glow: arcBlue(0.2) });
  if (t > 0.5) {
    ctx.save(); ctx.globalAlpha = remap(t, 0.5, 1, 0, 0.6);
    ctx.strokeStyle = armorGold(0.7); ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(cx+legSpread, shinY+6); ctx.lineTo(cx+legSpread, shinY+shinH-6); ctx.stroke();
    ctx.restore();
  }
}

function drawThighPlates(t, elapsed) {
  const b = getBodyBounds();
  const thighY = b.sy + b.sh * 0.55;
  const thighH = b.sh * 0.18;
  const cx = b.cx;
  const legSpread = b.photoW * 0.15;

  drawArmorPanel(cx - legSpread - 23, thighY, 46, thighH, t, { color: armorRed(), bevel: 5 });
  drawArmorPanel(cx - legSpread - 14, thighY + 4, 28, thighH*0.5, t*0.8, { color: armorGold(0.7), bevel: 3 });

  drawArmorPanel(cx + legSpread - 23, thighY, 46, thighH, t, { color: armorRed(), bevel: 5 });
  drawArmorPanel(cx + legSpread - 14, thighY + 4, 28, thighH*0.5, t*0.8, { color: armorGold(0.7), bevel: 3 });
}

function drawWaistPelvis(t, elapsed) {
  const b = getBodyBounds();
  const waistY = b.sy + b.sh * 0.50;
  const cx = b.cx;

  // Center waist plate
  drawArmorPanel(cx - 40, waistY, 80, b.sh * 0.07, t, { color: armorDark(0.9), stroke: armorGold(0.6), bevel: 4 });
  // Hip guards
  drawArmorPanel(cx - 70, waistY + 4, 28, b.sh * 0.10, t, { color: armorRed(), bevel: 4 });
  drawArmorPanel(cx + 42, waistY + 4, 28, b.sh * 0.10, t, { color: armorRed(), bevel: 4 });
}

function drawChestBack(t, elapsed) {
  const b = getBodyBounds();
  const chestY = b.sy + b.sh * 0.22;
  const chestH = b.sh * 0.30;
  const cx = b.cx;

  // Main chest plate
  ctx.save();
  ctx.globalAlpha = Math.min(t, 1);
  const scale = easeOut(Math.min(t * 1.2, 1));
  ctx.translate(cx, chestY + chestH/2);
  ctx.scale(scale, scale);
  ctx.translate(-cx, -(chestY + chestH/2));

  // Chest shape (hexagonal-ish)
  ctx.fillStyle = armorRed();
  ctx.strokeStyle = armorGold(0.9);
  ctx.lineWidth = 1.5;
  ctx.shadowColor = armorGold(0.4);
  ctx.shadowBlur = 10;
  ctx.beginPath();
  const cw = 90, ch = chestH;
  ctx.moveTo(cx - cw*0.4, chestY);
  ctx.lineTo(cx + cw*0.4, chestY);
  ctx.lineTo(cx + cw*0.5, chestY + ch*0.3);
  ctx.lineTo(cx + cw*0.5, chestY + ch*0.7);
  ctx.lineTo(cx + cw*0.35, chestY + ch);
  ctx.lineTo(cx - cw*0.35, chestY + ch);
  ctx.lineTo(cx - cw*0.5, chestY + ch*0.7);
  ctx.lineTo(cx - cw*0.5, chestY + ch*0.3);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();
  ctx.shadowBlur = 0;

  // Chest panel details
  if (t > 0.5) {
    const dt = remap(t, 0.5, 1, 0, 1);
    ctx.globalAlpha = dt * 0.7;
    ctx.strokeStyle = armorGold(0.5);
    ctx.lineWidth = 1;
    // Panel lines
    ctx.beginPath();
    ctx.moveTo(cx - 25, chestY + ch*0.15);
    ctx.lineTo(cx - 30, chestY + ch*0.55);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(cx + 25, chestY + ch*0.15);
    ctx.lineTo(cx + 30, chestY + ch*0.55);
    ctx.stroke();
  }

  ctx.restore();
}

function drawArcReactor(t, elapsed) {
  const b = getBodyBounds();
  const cx = b.cx;
  const cy = b.sy + b.sh * 0.32;

  ctx.save();
  ctx.globalAlpha = Math.min(t, 1);

  const r = 18 * easeOut(t);
  const pulse = 1 + Math.sin(elapsed * 0.008) * 0.08 * t;

  // Outer ring
  ctx.strokeStyle = arcBlue(0.9);
  ctx.lineWidth = 2;
  ctx.shadowColor = arcBlue(1);
  ctx.shadowBlur = 20 * t;
  ctx.beginPath();
  ctx.arc(cx, cy, r * pulse, 0, Math.PI * 2);
  ctx.stroke();

  // Inner glow
  const arcGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, r * pulse);
  arcGrad.addColorStop(0, arcBlue(0.9));
  arcGrad.addColorStop(0.5, arcBlue(0.4));
  arcGrad.addColorStop(1, arcBlue(0.05));
  ctx.fillStyle = arcGrad;
  ctx.beginPath();
  ctx.arc(cx, cy, r * pulse, 0, Math.PI * 2);
  ctx.fill();

  // Triangle inside arc reactor
  if (t > 0.6) {
    const ta = remap(t, 0.6, 1, 0, 1);
    ctx.globalAlpha = ta;
    ctx.strokeStyle = 'white';
    ctx.lineWidth = 1.5;
    ctx.shadowBlur = 8;
    const tr = r * 0.55 * pulse;
    ctx.beginPath();
    for (let i = 0; i < 3; i++) {
      const angle = (i / 3) * Math.PI * 2 - Math.PI/2;
      i === 0 ? ctx.moveTo(cx + Math.cos(angle)*tr, cy + Math.sin(angle)*tr)
              : ctx.lineTo(cx + Math.cos(angle)*tr, cy + Math.sin(angle)*tr);
    }
    ctx.closePath();
    ctx.stroke();
  }

  ctx.shadowBlur = 0;
  ctx.restore();
}

function drawArms(t, elapsed) {
  const b = getBodyBounds();
  const cx = b.cx;
  const armW = b.photoW * 0.5;
  const armTopY = b.sy + b.sh * 0.22;
  const armH = b.sh * 0.40;

  // Left arm
  const lx = cx - armW/2 - 15;
  drawArmorPanel(lx - 20, armTopY, 38, armH * 0.45, t, { color: armorRed(), bevel: 6, scaleDir: 'down' });
  drawArmorPanel(lx - 16, armTopY + armH*0.47, 30, armH * 0.35, t * 0.9, { color: armorRed(), bevel: 4 });
  // Forearm gold band
  drawArmorPanel(lx - 14, armTopY + armH*0.55, 26, 10, t * 0.8, { color: armorGold(0.8), bevel: 2 });
  // Repulsor on left hand
  if (t > 0.7) drawRepulsor(lx, armTopY + armH*0.85, remap(t, 0.7, 1, 0, 12), elapsed);

  // Right arm
  const rx = cx + armW/2 + 15;
  drawArmorPanel(rx - 18, armTopY, 38, armH * 0.45, t, { color: armorRed(), bevel: 6, scaleDir: 'down' });
  drawArmorPanel(rx - 14, armTopY + armH*0.47, 30, armH * 0.35, t * 0.9, { color: armorRed(), bevel: 4 });
  drawArmorPanel(rx - 12, armTopY + armH*0.55, 26, 10, t * 0.8, { color: armorGold(0.8), bevel: 2 });
  if (t > 0.7) drawRepulsor(rx + 4, armTopY + armH*0.85, remap(t, 0.7, 1, 0, 12), elapsed);
}

function drawShoulders(t, elapsed) {
  const b = getBodyBounds();
  const cx = b.cx;
  const sy2 = b.sy + b.sh * 0.15;

  // Left shoulder pauldron
  ctx.save();
  ctx.globalAlpha = Math.min(t, 1);
  ctx.fillStyle = armorRed();
  ctx.strokeStyle = armorGold(0.9);
  ctx.lineWidth = 1.5;
  ctx.shadowColor = armorGold(0.3);
  ctx.shadowBlur = 12;

  const lsx = cx - b.photoW*0.25 - 28;
  ctx.beginPath();
  ctx.ellipse(lsx, sy2, 28 * easeOut(t), 20 * easeOut(t), -0.3, 0, Math.PI*2);
  ctx.fill(); ctx.stroke();

  const rsx = cx + b.photoW*0.25 + 28;
  ctx.beginPath();
  ctx.ellipse(rsx, sy2, 28 * easeOut(t), 20 * easeOut(t), 0.3, 0, Math.PI*2);
  ctx.fill(); ctx.stroke();

  ctx.shadowBlur = 0;
  ctx.restore();
}

function drawHelmet(t, elapsed) {
  const b = getBodyBounds();
  const cx = b.cx;
  const headCY = b.sy + b.sh * 0.10;
  const headH = b.sh * 0.18;

  ctx.save();
  ctx.globalAlpha = Math.min(t, 1);

  const scale = easeOut(t);
  ctx.translate(cx, headCY);
  ctx.scale(scale, scale);
  ctx.translate(-cx, -headCY);

  const hw = 52, hh = headH;
  const hy = headCY - hh * 0.6;

  // Head dome
  ctx.fillStyle = armorRed();
  ctx.strokeStyle = armorGold(0.9);
  ctx.lineWidth = 1.8;
  ctx.shadowColor = armorGold(0.5);
  ctx.shadowBlur = 15;
  ctx.beginPath();
  ctx.moveTo(cx - hw*0.4, hy + hh);
  ctx.lineTo(cx - hw*0.5, hy + hh*0.5);
  ctx.lineTo(cx - hw*0.38, hy);
  ctx.lineTo(cx, hy - hh*0.12);
  ctx.lineTo(cx + hw*0.38, hy);
  ctx.lineTo(cx + hw*0.5, hy + hh*0.5);
  ctx.lineTo(cx + hw*0.4, hy + hh);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();
  ctx.shadowBlur = 0;

  // Eye slits
  if (t > 0.5) {
    const et = remap(t, 0.5, 1, 0, 1);
    ctx.globalAlpha = et;
    const eyeY = hy + hh * 0.38;
    const eyeW = 22 * et;
    const eyeH = 6;

    // Left eye glow
    ctx.fillStyle = arcBlue(0.95);
    ctx.shadowColor = arcBlue(1);
    ctx.shadowBlur = 20;
    ctx.beginPath();
    ctx.ellipse(cx - 14, eyeY, eyeW * 0.45, eyeH * 0.4, 0.15, 0, Math.PI*2);
    ctx.fill();

    // Right eye glow
    ctx.beginPath();
    ctx.ellipse(cx + 14, eyeY, eyeW * 0.45, eyeH * 0.4, -0.15, 0, Math.PI*2);
    ctx.fill();

    ctx.shadowBlur = 0;

    // Chin plate
    ctx.fillStyle = armorDark(0.9);
    ctx.strokeStyle = armorGold(0.6);
    ctx.lineWidth = 1;
    ctx.shadowBlur = 0;
    ctx.beginPath();
    ctx.roundRect(cx - hw*0.36, eyeY + eyeH*2, hw*0.72, hh*0.3, 3);
    ctx.fill();
    ctx.stroke();
  }

  ctx.restore();
}

function drawRepulsor(x, y, r, elapsed) {
  if (r <= 0) return;
  const pulse = 1 + Math.sin(elapsed * 0.01) * 0.15;
  ctx.save();
  ctx.shadowColor = arcBlue(1);
  ctx.shadowBlur = 20;
  const rg = ctx.createRadialGradient(x, y, 0, x, y, r * pulse);
  rg.addColorStop(0, 'white');
  rg.addColorStop(0.3, arcBlue(1));
  rg.addColorStop(1, arcBlue(0));
  ctx.fillStyle = rg;
  ctx.beginPath();
  ctx.arc(x, y, r * pulse, 0, Math.PI*2);
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.restore();
}

function drawAssemblySparks(p, elapsed) {
  const b = getBodyBounds();
  const cx = b.cx;

  // Determine active assembly zone Y based on progress
  let sparkY;
  if (p < 0.28) sparkY = b.sy + b.sh * 0.85;
  else if (p < 0.45) sparkY = b.sy + b.sh * 0.65;
  else if (p < 0.60) sparkY = b.sy + b.sh * 0.47;
  else if (p < 0.75) sparkY = b.sy + b.sh * 0.35;
  else if (p < 0.88) sparkY = b.sy + b.sh * 0.25;
  else sparkY = b.sy + b.sh * 0.08;

  const seed = Math.floor(elapsed / 50);
  for (let i = 0; i < 5; i++) {
    const hash = Math.sin(seed * 127.1 + i * 311.7) * 43758.5453;
    const rx = (hash - Math.floor(hash)) * b.photoW - b.photoW/2 + cx;
    const hash2 = Math.sin(seed * 269.5 + i * 183.3) * 43758.5453;
    const ry = sparkY + (hash2 - Math.floor(hash2)) * 40 - 20;
    const hash3 = Math.sin(seed * 113.5 + i * 90.1) * 43758.5453;
    const sr = (hash3 - Math.floor(hash3)) * 2.5 + 0.5;

    ctx.save();
    ctx.fillStyle = i % 2 === 0 ? armorGold(0.9) : arcBlue(0.8);
    ctx.shadowColor = ctx.fillStyle;
    ctx.shadowBlur = 8;
    ctx.beginPath();
    ctx.arc(rx, ry, sr, 0, Math.PI*2);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.restore();
  }
}

function drawFinalGlow(t, elapsed) {
  const pulse = 1 + Math.sin(elapsed * 0.005) * 0.3;
  const grad = ctx.createRadialGradient(W/2, H*0.45, 0, W/2, H*0.45, W*0.7);
  grad.addColorStop(0, `rgba(200,144,26,${t * 0.12 * pulse})`);
  grad.addColorStop(0.5, `rgba(139,0,0,${t * 0.08})`);
  grad.addColorStop(1, 'transparent');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // Edge vignette glow
  ctx.strokeStyle = `rgba(200,144,26,${t * 0.5})`;
  ctx.lineWidth = 3;
  ctx.shadowColor = armorGold(0.8);
  ctx.shadowBlur = 20;
  ctx.strokeRect(3, 3, W-6, H-6);
  ctx.shadowBlur = 0;
}

function drawHUDFrame(alpha) {
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.strokeStyle = arcBlue(0.5);
  ctx.lineWidth = 1;

  // Corner bracket marks
  const bs = 18;
  [[0,0,1,1],[W,0,-1,1],[0,H,1,-1],[W,H,-1,-1]].forEach(([x,y,dx,dy]) => {
    ctx.beginPath();
    ctx.moveTo(x + dx*bs, y);
    ctx.lineTo(x, y);
    ctx.lineTo(x, y + dy*bs);
    ctx.stroke();
  });

  ctx.restore();
}

// ── Recording Done ───────────────────────────────────────────
function onRecordingDone() {
  const blob = new Blob(recordedChunks, { type: 'video/webm' });
  const url = URL.createObjectURL(blob);
  btnDownload.style.display = 'block';
  btnDownload.onclick = () => {
    const a = document.createElement('a');
    a.href = url;
    a.download = 'ironman-suitup.webm';
    a.click();
  };
}

// Initial state
drawBackground(0);
ctx.save();
ctx.fillStyle = arcBlue(0.15);
ctx.font = "900 14px 'Orbitron', monospace";
ctx.textAlign = 'center';
ctx.fillText('UPLOAD PHOTO TO BEGIN', W/2, H/2 - 10);
ctx.font = "12px 'Rajdhani', monospace";
ctx.fillStyle = arcBlue(0.3);
ctx.fillText('STARK INDUSTRIES MARK L', W/2, H/2 + 16);
ctx.textAlign = 'left';
ctx.restore();
drawHUDFrame(0.2);
</script>
